{% extends "site/base.html" %}
{% block title %}Page not found — {{ site.hero_name }}{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="mx-auto flex max-w-lg flex-col items-center px-6 py-32 text-center">
  <p class="font-display text-6xl font-extrabold text-sand">404</p>
  <h1 class="mt-4 font-display text-3xl font-extrabold">This page doesn't exist</h1>
  <p class="mt-3 leading-relaxed text-muted">
    The link may be out of date, or the page may have moved.
  </p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="/" class="btn-primary">Back home</a>
    <a href="/blog/" class="btn-ghost">Read the blog</a>
  </div>
</div>
{% endblock %}
