# Bootstrap-phase vhost for siphira.fluximpact.org — HTTP only, no TLS.
#
# Exists to break a chicken-and-egg problem: the real vhost references a
# certificate that does not exist yet, and `nginx -t` fails hard on a missing
# certificate file, so it cannot be installed first. This file serves the ACME
# challenge (and the site, unencrypted) just long enough for certbot to issue
# the cert, after which bootstrap.sh swaps in scripts/nginx-siphira.conf.
#
# It should never be the config in place for more than a minute or two.

server {
    listen 80;
    listen [::]:80;
    server_name siphira.fluximpact.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
