# siphira.fluximpact.org — Siphira John's personal site.
# Deploy to /etc/nginx/sites-available/siphira and symlink into sites-enabled.
#
# TLS: this vhost uses its OWN certificate at
#   /etc/letsencrypt/live/siphira.fluximpact.org/
# rather than the shared fluximpact.org cert. That shared cert is a SAN list
# covering 11 other names; adding this host to it would mean `certbot --expand`
# rewriting the certificate every other site on the box depends on. A separate
# cert gets the identical result with none of that blast radius, and it renews
# independently.
#
# scripts/bootstrap.sh issues it via webroot ACME and only swaps this file in
# once the cert exists — nginx -t fails hard on a missing certificate file, so
# the ordering matters.
#
# Static files are served by WhiteNoise inside the app, so there is no
# /static/ alias block — one proxy handles everything except /media/.

server {
    listen 80;
    listen [::]:80;
    server_name siphira.fluximpact.org;

    # Keep the ACME path on HTTP so renewals never depend on a working
    # certificate — that circularity is what breaks silent auto-renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siphira.fluximpact.org;

    ssl_certificate     /etc/letsencrypt/live/siphira.fluximpact.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siphira.fluximpact.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Declared once at server level: an add_header inside a location REPLACES
    # inherited ones, so per-location headers would silently drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 12M;   # post covers / project screenshots

    # Uploaded images.
    location /media/ {
        alias /srv/siphira/media/;
        expires 30d;
        access_log off;
    }

    # Tighter bucket on the admin login than on ordinary page reads.
    # `flux_general` is defined in the shared http{} context
    # (/etc/nginx/conf.d/flux-ratelimit.conf).
    location /admin/login/ {
        limit_req zone=flux_general burst=5 nodelay;
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        limit_req zone=flux_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        # AnalyticsMiddleware trusts X-Real-IP, so nginx must set it here and
        # overwrite any client-supplied value — otherwise a visitor could forge
        # their own analytics identity.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
