# siphira.fluximpact.org — Siphira John's personal site.
# Deploy to /etc/nginx/sites-available/siphira and symlink into sites-enabled.
#
# TLS: reuses the existing fluximpact.org certificate. That cert must actually
# carry this hostname — either as a wildcard (*.fluximpact.org) or as an
# explicit SAN. Verify BEFORE enabling this file:
#
#   sudo openssl x509 -in /etc/letsencrypt/live/fluximpact.org/fullchain.pem \
#        -noout -text | grep -A1 "Subject Alternative Name"
#
# If siphira.fluximpact.org is absent and there is no wildcard, expand the cert
# (this rewrites the certificate every other site on the box shares, so do it
# deliberately, not as a side effect of a deploy):
#
#   sudo certbot --nginx -d siphira.fluximpact.org
#
# Static files are served by WhiteNoise inside the app, so there is no
# /static/ alias block here — one proxy handles everything.

server {
    listen 80;
    listen [::]:80;
    server_name siphira.fluximpact.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siphira.fluximpact.org;

    ssl_certificate     /etc/letsencrypt/live/fluximpact.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluximpact.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Declared once at server level: an add_header inside a location REPLACES
    # inherited ones, so per-location headers would silently drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Uploaded images (post covers, project screenshots).
    location /media/ {
        alias /srv/siphira/media/;
        expires 30d;
        access_log off;
    }

    # Brute-force surface: the admin login and the two public write endpoints
    # get a tighter bucket than ordinary page reads. `flux_general` is defined
    # in the shared http{} context (scripts/nginx.conf in the fluximpact repo).
    location /admin/login/ {
        limit_req zone=flux_general burst=5 nodelay;
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        limit_req zone=flux_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        # AnalyticsMiddleware trusts X-Real-IP, so it must be set HERE and not
        # be forwardable by a client — nginx overwrites any inbound value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
